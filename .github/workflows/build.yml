name: Build

permissions:
  contents: read

on:
  workflow_dispatch:

  push:
    branches: [ main ]
    paths-ignore:
    - 'docs/**'
    - 'README.md'

  pull_request:
    branches: [ main ]
    paths-ignore:
    - 'docs/**'
    - 'README.md'

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        NUGET_PACKAGES: ${{ matrix.os == 'ubuntu-latest' && '/mnt/nuget/packages' || format('{0}/.nuget/packages', github.workspace) }}
        NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/.nuget/http-cache
        NUGET_SCRATCH: ${{ github.workspace }}/.nuget/scratch
        NUGET_PLUGINS_CACHE_PATH: ${{ github.workspace }}/.nuget/plugins

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Prepare Linux NuGet package directory
      if: runner.os == 'Linux'
      shell: bash
      run: sudo install -d -o "$(id -u)" -g "$(id -g)" "$NUGET_PACKAGES"
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: |
          10.0.x
        global-json-file: global.json
        check-latest: false
    - name: Restore
      run: dotnet restore -p:Configuration=Release -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True
    - name: Build
      run: dotnet build --configuration Release --no-restore -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True
    - name: Test
      run: dotnet test --configuration Release --no-build --minimum-expected-tests 1
    # Same suite on the net10.0 host, bound to GregsEx's net8.0 and netstandard2.0 assets
    # (netstandard2.0: polyfilled APIs, no runtime compilation or generated kernels).
    - name: Test net8.0 asset
      run: dotnet test --project test/GregsEx.Tests --configuration Release -p:GregsExTargetFramework=net8.0 -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True --minimum-expected-tests 1
    - name: Test netstandard2.0 asset
      run: dotnet test --project test/GregsEx.Tests --configuration Release -p:GregsExTargetFramework=netstandard2.0 -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True --minimum-expected-tests 1
    - name: Test .NET Framework runtime
      if: runner.os == 'Windows'
      run: dotnet test --project test/GregsEx.Framework.Tests --configuration Release -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True --minimum-expected-tests 1

    # Pack on every run so a missing target asset fails the pull request, not only main or a release tag.
    - name: Pack preview packages
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack --output artifacts --configuration Release --no-build -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True

    - name: Push preview packages to Feedz
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
      shell: bash
      env:
        FEEDZ_IO_API_KEY: ${{ secrets.FEEDZ_IO_API_KEY }}
      run: |
        set -euo pipefail
        if [[ -z "$FEEDZ_IO_API_KEY" ]]; then
          echo "Feedz publishing skipped: FEEDZ_IO_API_KEY is not configured."
          exit 0
        fi
        for package in artifacts/*.nupkg; do
          dotnet nuget push "$package" --api-key "$FEEDZ_IO_API_KEY" --source https://f.feedz.io/sebastienros/gregsex/nuget/index.json --skip-duplicate
        done
