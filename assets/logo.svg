<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">GregsEx</title>
  <desc id="desc">White start and end regex anchors above a cyan match line on a rounded violet-to-blue tile.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset=".55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#background)"/>
  <rect width="512" height="512" rx="112" fill="url(#gloss)"/>
  <g stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M112 258 176 178 240 258"/>
    <path d="M378 194C365 180 348 174 329 174C303 174 284 188 284 208C284 255 378 230 378 278C378 300 357 316 330 316C308 316 289 307 278 294"/>
    <path d="M330 148V342" stroke-width="18"/>
  </g>
  <path d="M132 380H380" stroke="#A5F3FC" stroke-width="10" stroke-linecap="round"/>
  <circle cx="132" cy="380" r="10" fill="#A5F3FC"/>
  <circle cx="380" cy="380" r="10" fill="#A5F3FC"/>
</svg>
